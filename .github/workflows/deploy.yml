name: Deploy to GitHub Pages

on:
  push:
    # Both names are listed so renaming the default branch to `main` doesn't
    # silently stop deployments.
    branches:
      - main
      - claude/personal-portfolio-website-suee1v
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it — a cancelled deploy
# can leave the live site mid-update.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # The site is plain HTML, CSS, and JS, so the repo root is already the
      # finished artifact — there is nothing to build.
      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
